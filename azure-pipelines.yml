trigger:
  - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: suiteXmlFile
    displayName: 'TestNG Suite to Run'
    type: string
    default: 'testng_chrome.xml'
    values:
      - testng_chrome.xml
      - testng_firefox.xml
      - testng_regression.xml

  - name: runOnSelfHostedAgent
    displayName: 'Run demo stage on self-hosted macOS agent (requires agent running locally)'
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: BuildJob
        displayName: 'Compile Project'
        steps:
          - task: Cache@2
            displayName: 'Cache Maven Dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(HOME)/.m2/repository

          - task: Maven@4
            displayName: 'Maven Compile'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean compile'
              options: '-Denv=qa'

  - stage: Test
    displayName: 'Test Execution Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TestJob
        displayName: 'Run Selenium Tests'
        steps:
          - task: Cache@2
            displayName: 'Cache Maven Dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(HOME)/.m2/repository

          - task: Maven@4
            displayName: 'Maven Test'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
              options: '-Denv=qa -Dheadless=true -DsuiteXmlFile=src/test/resources/testrunners/${{ parameters.suiteXmlFile }}'

  - stage: SelfHostedDemo
    displayName: 'Self-Hosted Agent Demo'
    dependsOn: Test
    condition: and(succeeded(), eq('${{ parameters.runOnSelfHostedAgent }}', 'true'))
    pool: 'macOS-local-agent'
    jobs:
      - job: SelfHostedJob
        displayName: 'Run on Self-Hosted macOS Agent'
        steps:
          - script: |
              echo "Running on self-hosted agent"
              java -version
              mvn -v
            displayName: 'Verify agent environment'

          - task: Maven@4
            displayName: 'Maven Test (self-hosted)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
              options: '-Denv=qa -DsuiteXmlFile=src/test/resources/testrunners/${{ parameters.suiteXmlFile }}'