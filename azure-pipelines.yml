trigger:
  - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: suiteXmlFile
    displayName: 'TestNG Suite to Run'
    type: string
    default: 'testng_chrome.xml'
    values:
      - testng_chrome.xml
      - testng_firefox.xml
      - testng_regression.xml

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: BuildJob
        displayName: 'Compile Project'
        steps:
          - task: Cache@2
            displayName: 'Cache Maven Dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(HOME)/.m2/repository

          - task: Maven@4
            displayName: 'Maven Compile'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean compile'
              options: '-Denv=qa'

  - stage: Test
    displayName: 'Test Execution Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TestJob
        displayName: 'Run Selenium Tests'
        steps:
          - task: Cache@2
            displayName: 'Cache Maven Dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(HOME)/.m2/repository

          - task: Maven@4
            displayName: 'Maven Test'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
              options: '-Denv=qa -Dheadless=true -DsuiteXmlFile=src/test/resources/testrunners/${{ parameters.suiteXmlFile }}'